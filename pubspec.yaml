name: medipop_core
description: Offline clinical dictation core — on-device speech, local LLM extraction driven by declarative packages, human validation, local storage and pluggable identity/config/sync adapters.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  llamadart: ^0.6.10
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0
  crypto: ^3.0.7
  file_selector: ^1.1.0
  shared_preferences: ^2.5.5
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/packages/
